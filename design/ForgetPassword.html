<!DOCTYPE html>
<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyFlow - 忘记密码</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4A90E2",
              "background-light": "#F8F9FA",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
<div class="flex w-full max-w-md flex-col items-center rounded-xl border border-slate-200/50 bg-white/50 p-6 shadow-sm dark:border-slate-800/50 dark:bg-background-dark/50 md:p-10">
<div class="flex items-center gap-2 pb-6">
<span class="material-symbols-outlined text-4xl text-primary">auto_stories</span>
<p class="text-3xl font-bold text-slate-800 dark:text-white">StudyFlow</p>
</div>
<div class="text-center">
<h1 class="text-slate-800 dark:text-white text-[32px] font-bold tracking-tight">忘记密码</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pt-1 pb-8">输入您的帐户信息以重置密码。</p>
</div>
<div class="flex w-full flex-col gap-4">
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="email">电子邮件地址</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="email" placeholder="输入您的电子邮件地址" type="email" value=""/>
</div>
</div>
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="captcha">图形验证码</label>
<div class="flex items-center gap-3">
<div class="relative flex w-full flex-1 items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">barcode_scanner</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="captcha" placeholder="输入图形验证码" type="text" value=""/>
</div>
<div class="flex h-14 cursor-pointer items-center justify-center rounded-lg border border-slate-300 bg-slate-100 px-4 dark:border-slate-700 dark:bg-slate-800">
<img alt="图形验证码" class="h-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOc8vDUxisCkbA_k5_WXX-WvjNwjmC6uyOxHDtfMjyyn-cvgCtycBmw2w7D4mgMyUS0-psNEQ0lvyWyO8z8f_-Hg1zN2B6U_-4K7CKA3FDqjurbfOWqyv_Gb0Evm1ZgjeAIfbPZlPK0U14iJet2t6dcvphfqHeMgjqPpErdwOXAvX2U-HI7DYLFhgcN2EO_rVY3Kxr6RhiDxcgmUwpE2YBoL2vq-qrfKJO8bUJBTIagxqzGRgAsT6ItiIKFAUb_AhJ46KSBdEFxQw"/>
</div>
</div>
</div>
<button class="mt-2 flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-semibold text-white transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark disabled:cursor-not-allowed disabled:bg-primary/50" disabled="">获取邮件验证码</button>
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="email-captcha">邮件验证码</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">mark_email_unread</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="email-captcha" placeholder="输入您的邮件验证码" type="text" value=""/>
</div>
</div>
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="new-password">新密码</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="new-password" placeholder="输入您的新密码" type="password" value=""/>
</div>
</div>
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="confirm-password">确认新密码</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">lock_reset</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="confirm-password" placeholder="再次输入您的新密码" type="password" value=""/>
</div>
</div>
<button class="mt-2 flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-semibold text-white transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark disabled:cursor-not-allowed disabled:bg-primary/50">重置密码</button>
</div>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal pt-8">
            记起密码了？ <a class="font-medium text-primary underline" href="#">返回登录</a>
</p>
</div>
</div>

</body></html>
