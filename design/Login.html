<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4A90E2",
              "background-light": "#F8F9FA",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Lexend", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4">
<div class="flex w-full max-w-md flex-col items-center rounded-xl border border-slate-200/50 bg-white/50 p-6 shadow-sm dark:border-slate-800/50 dark:bg-background-dark/50 md:p-10">
<!-- Logo -->
<div class="flex items-center gap-2 pb-6">
<span class="material-symbols-outlined text-4xl text-primary">auto_stories</span>
<p class="text-3xl font-bold text-slate-800 dark:text-white">StudyFlow</p>
</div>
<!-- Headline and Body Text -->
<div class="text-center">
<h1 class="text-slate-800 dark:text-white text-[32px] font-bold tracking-tight">Welcome Back</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pt-1 pb-8">Your path to academic success starts here.</p>
</div>
<!-- Form -->
<div class="flex w-full flex-col gap-4">
<!-- Email TextField -->
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="email">Email address</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">mail</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 text-base font-normal leading-normal" id="email" placeholder="Enter your email" type="email" value=""/>
</div>
</div>
<!-- Password TextField -->
<div class="flex w-full flex-col">
<label class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal pb-2" for="password">Password</label>
<div class="relative flex w-full items-center">
<span class="material-symbols-outlined absolute left-4 text-slate-400 dark:text-slate-500">lock</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg border border-slate-300 bg-background-light text-slate-900 placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:placeholder:text-slate-500 dark:focus:border-primary dark:focus:ring-primary h-14 p-[15px] pl-12 pr-12 text-base font-normal leading-normal" id="password" placeholder="Enter your password" type="password" value=""/>
<button aria-label="Toggle password visibility" class="absolute right-0 flex h-14 w-14 items-center justify-center text-slate-400 dark:text-slate-500">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-primary text-sm font-medium leading-normal underline" href="#">Forgot Password?</a>
</div>
<!-- Log In Button -->
<button class="flex h-14 w-full items-center justify-center rounded-lg bg-primary px-6 text-base font-semibold text-white transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-background-light dark:focus-visible:ring-offset-background-dark">
                    Log In
                </button>
</div>
<!-- Sign Up Link -->
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal pt-8">
                Don't have an account? <a class="font-medium text-primary underline" href="#">Sign Up</a>
</p>
</div>
</div>
</body></html>
