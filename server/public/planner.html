<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Planner · Study Planner</title><style>*,*:before,*:after{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#0b1020;color:#e6edf3}a{color:#7aa2ff;text-decoration:none}.container{max-width:1200px;margin:32px auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.muted{opacity:.85}.grid{display:grid;grid-template-columns:2fr 3fr;gap:16px}.card{background:#0f172a;border:1px solid #1f2a44;border-radius:12px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.title{margin:0 0 12px 0;font-size:18px}.field{margin:10px 0}.label{font-size:12px}.input{width:100%;padding:10px 12px;margin-top:6px;background:#0b1222;border:1px solid #243454;border-radius:8px;color:#e6edf3;outline:none}.input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #2a3a5a;background:#13233a;color:#e6edf3;border-radius:8px;padding:8px 12px;cursor:pointer}.btn:hover{background:#163050}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.primary:hover{background:#1d4ed8}.row{display:flex;gap:8px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:8px}.item{padding:10px 12px;border:1px solid #243454;border-radius:8px;background:#0b1222;display:flex;justify-content:space-between;align-items:center}.kvs{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}.kv{background:#1f2a44;border-radius:999px;padding:2px 8px}.timeline{display:flex;flex-direction:column;gap:8px}.block{padding:10px 12px;border:1px solid #243454;border-radius:8px;background:#0b1222}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#1f2a44;margin-left:8px}.section{margin-top:12px}.sep{height:1px;background:#1f2a44;margin:12px 0}.danger{background:#7f1d1d;border-color:#7f1d1d}.success{background:#14532d;border-color:#14532d}</style></head><body><div class="container"><div class="header"><div class="row"><h1 style="margin:0;font-size:20px">Study Planner</h1><span id="authState" class="pill">未登录</span></div><div class="row muted"><a href="/">Home</a><span>·</span><a href="/login">Login</a><span>·</span><a href="/docs" target="_blank">Docs</a><span>·</span><a href="/openapi.json" target="_blank">OpenAPI</a></div></div><div class="card" style="margin-bottom:16px"><div class="row" style="align-items:flex-end;gap:12px"><div><div class="label">日期</div><input id="date" type="date" class="input" style="width:200px"/></div><div><button class="btn" id="prev">前一天</button><button class="btn" id="today">今天</button><button class="btn" id="next">后一天</button></div><div class="sep" style="width:1px;height:36px"></div><div><div class="label">分享范围</div><select id="shareScope" class="input" style="width:220px"><option value="full">完整（任务+时间块）</option><option value="blocks_only">仅时间块</option></select></div><div><div class="label">过期天数</div><input id="shareDays" type="number" min="1" max="365" value="7" class="input" style="width:120px"/></div><div><button class="btn" id="btn-share">创建分享链接</button></div><div class="muted" id="shareMsg"></div></div></div><div class="grid"><div><div class="card"><h2 class="title">任务</h2><div class="section"><div class="label">新建任务</div><div class="row"><input id="taskTitle" class="input" placeholder="任务标题" style="flex:1"/><input id="taskDue" class="input" type="time" style="width:140px"/><button class="btn primary" id="addTask">添加</button></div></div><div class="sep"></div><div class="section"><div class="label">今天 & 逾期</div><div id="tasks" class="list"></div></div></div><div class="card" style="margin-top:16px"><h2 class="title">我的分享</h2><div id="shares" class="list"></div></div></div><div><div class="card"><h2 class="title">时间块（日视图）</h2><div class="section"><div class="row"><input id="blockStart" type="time" class="input" style="width:140px"/><input id="blockEnd" type="time" class="input" style="width:140px"/><select id="blockTask" class="input" style="width:220px"><option value="">无关联任务</option></select><button class="btn primary" id="addBlock">添加时间块</button></div></div><div class="sep"></div><div id="blocks" class="timeline"></div></div></div></div></div><script>const $=(s)=>document.querySelector(s);const authState=$('#authState');const dateEl=$('#date');const tasksEl=$('#tasks');const blockTaskSel=$('#blockTask');const blocksEl=$('#blocks');const shareMsg=$('#shareMsg');const sharesEl=$('#shares');function loadToken(){return localStorage.getItem('jwt')||''}function setAuthState(){authState.textContent=loadToken()?'已登录':'未登录';authState.style.background=loadToken()?'#1a3d24':'#3a1f24'}function json(r){return r.json()}function hdr(){const t=loadToken();return t?{'Authorization':'Bearer '+t}:{}}function todayStr(d=new Date()){return d.toISOString().slice(0,10)}function toIso(dateStr,timeStr){const t=(timeStr||'00:00')+':00.000Z';return `${dateStr}T${t}`}async function fetchDaily(){const d=dateEl.value;const [tasksDaily, blocksDaily]=await Promise.all([fetch(`/tasks/daily?date=${d}`,{headers:hdr()}).then(json),fetch(`/blocks/daily?date=${d}`,{headers:hdr()}).then(json)]);renderTasks(tasksDaily);renderBlocks(blocksDaily.items||[])}function renderTasks(data){tasksEl.innerHTML='';blockTaskSel.innerHTML='<option value="">无关联任务</option>';const addTaskOpt=(t)=>{const opt=document.createElement('option');opt.value=t.id;opt.textContent=t.title;blockTaskSel.appendChild(opt)};const makeItem=(t,isOverdue)=>{const div=document.createElement('div');div.className='item';const left=document.createElement('div');left.innerHTML=`<div>${t.title}</div><div class="kvs"><span class="kv">状态: ${t.status}</span>${t.due_at?`<span class=kv>截止: ${new Date(t.due_at).toLocaleString()}</span>`:''}${isOverdue?'<span class="kv danger">逾期</span>':''}</div>`;const right=document.createElement('div');const btnDone=document.createElement('button');btnDone.className='btn';btnDone.textContent='完成';btnDone.onclick=()=>updateTask(t.id,{status:'done'});const btnDel=document.createElement('button');btnDel.className='btn';btnDel.textContent='删除';btnDel.onclick=()=>deleteTask(t.id);right.appendChild(btnDone);right.appendChild(btnDel);div.appendChild(left);div.appendChild(right);tasksEl.appendChild(div);addTaskOpt(t)};(data.today||[]).forEach(t=>makeItem(t,false));(data.overdue||[]).forEach(t=>makeItem(t,true))}function renderBlocks(items){blocksEl.innerHTML='';items.sort((a,b)=>a.start_at.localeCompare(b.start_at));for(const b of items){const div=document.createElement('div');div.className='block';const title=`${new Date(b.start_at).toLocaleTimeString()} — ${new Date(b.end_at).toLocaleTimeString()}${b.task_id?` · 任务 ${b.task_id}`:''}`;div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div>${title}</div><div class="row"><button class="btn" data-id="${b.id}">删除</button></div></div>`;const btn=div.querySelector('button');if(btn)btn.onclick=()=>deleteBlock(b.id);blocksEl.appendChild(div)}}async function addTask(){const title=$('#taskTitle').value.trim();if(!title){alert('请输入任务标题');return}const due=$('#taskDue').value;const date=dateEl.value;const payload={title, due_at: due?toIso(date,due):undefined};const r=await fetch('/tasks',{method:'POST',headers:{'Content-Type':'application/json',...hdr()},body:JSON.stringify(payload)});if(!r.ok){alert('创建任务失败');return}$('#taskTitle').value='';$('#taskDue').value='';await fetchDaily()}async function updateTask(id,patch){const r=await fetch(`/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...hdr()},body:JSON.stringify(patch)});if(!r.ok){alert('更新任务失败');return}await fetchDaily()}async function deleteTask(id){const r=await fetch(`/tasks/${id}`,{method:'DELETE',headers:hdr()});if(!r.ok){alert('删除任务失败');return}await fetchDaily()}async function addBlock(){const date=dateEl.value;const s=$('#blockStart').value;const e=$('#blockEnd').value;const tid=$('#blockTask').value||null;if(!s||!e){alert('请选择开始/结束时间');return}const payload={start_at: toIso(date,s), end_at: toIso(date,e), task_id: tid};const r=await fetch('/blocks',{method:'POST',headers:{'Content-Type':'application/json',...hdr()},body:JSON.stringify(payload)});if(!r.ok){const j=await r.json().catch(()=>({}));alert('创建时间块失败: '+(j.error||r.status));return}$('#blockStart').value='';$('#blockEnd').value='';await fetchDaily()}async function deleteBlock(id){const r=await fetch(`/blocks/${id}`,{method:'DELETE',headers:hdr()});if(!r.ok){alert('删除时间块失败');return}await fetchDaily()}async function createShare(){const scope=$('#shareScope').value;const days=Number(($('#shareDays').value));const payload={scope, expires_in_days: days};const r=await fetch('/shares',{method:'POST',headers:{'Content-Type':'application/json',...hdr()},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok){shareMsg.textContent='创建失败: '+(j.error||r.status);shareMsg.style.color='#f87171';return}shareMsg.innerHTML=`已创建: <a href="${j.url}" target="_blank">${j.url}</a>`;shareMsg.style.color='#a7f3d0';await listShares()}async function listShares(){const r=await fetch('/shares',{headers:hdr()});const j=await r.json();sharesEl.innerHTML='';if(!r.ok){sharesEl.textContent='加载失败';return}(j.items||[]).forEach(s=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<div><div>scope: ${s.scope} <span class="kv">过期: ${new Date(s.expires_at).toLocaleString()}</span></div><a href="${location.origin}/shared/${s.token}" target="_blank">${location.origin}/shared/${s.token}</a></div><div class="row"><button class="btn" data-id="${s.id}">删除</button></div>`;const btn=div.querySelector('button');if(btn)btn.onclick=()=>deleteShare(s.id);sharesEl.appendChild(div)})}async function deleteShare(id){const r=await fetch(`/shares/${id}`,{method:'DELETE',headers:hdr()});if(!r.ok){alert('删除失败');return}await listShares()}$('#prev').addEventListener('click',()=>{const d=new Date(dateEl.value);d.setUTCDate(d.getUTCDate()-1);dateEl.value=todayStr(d);fetchDaily()});$('#today').addEventListener('click',()=>{dateEl.value=todayStr();fetchDaily()});$('#next').addEventListener('click',()=>{const d=new Date(dateEl.value);d.setUTCDate(d.getUTCDate()+1);dateEl.value=todayStr(d);fetchDaily()});$('#addTask').addEventListener('click',addTask);$('#addBlock').addEventListener('click',addBlock);$('#btn-share').addEventListener('click',createShare);window.addEventListener('load',()=>{setAuthState();dateEl.value=todayStr();fetchDaily();listShares()});</script></body></html>
