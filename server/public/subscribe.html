<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Web Push 订阅 · Study Planner</title><style>*,*:before,*:after{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#0b1020;color:#e6edf3}a{color:#7aa2ff;text-decoration:none}.container{max-width:920px;margin:40px auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.muted{opacity:.85}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#0f172a;border:1px solid #1f2a44;border-radius:12px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.title{margin:0 0 10px 0;font-size:18px}.field{margin:10px 0}.label{font-size:12px}.input{width:100%;padding:10px 12px;margin-top:6px;background:#0b1222;border:1px solid #243454;border-radius:8px;color:#e6edf3;outline:none}.input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid #2a3a5a;background:#13233a;color:#e6edf3;border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover{background:#163050}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.primary:hover{background:#1d4ed8}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#1f2a44;margin-left:8px}.pre{white-space:pre-wrap;background:#0b1222;border:1px solid #243454;border-radius:8px;padding:10px}</style></head><body><div class="container"><div class="header"><h1 style="margin:0;font-size:20px">Study Planner Dev</h1><div class="muted"><a href="/">Home</a> · <a href="/login">Login</a> · <a href="/docs" target="_blank">Docs</a></div></div><div class="grid"><div class="card"><h2 class="title">步骤 1：获取 JWT<span id="authState" class="pill">未登录</span></h2><div class="field"><div class="label">邮箱</div><input id="email" type="email" class="input" placeholder="you@example.com"/></div><div class="field"><div class="label">密码</div><input id="password" type="password" class="input" placeholder="••••••••"/></div><div class="field" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="btn-login" type="button">登录</button><button class="btn" id="btn-load" type="button">读取本地 JWT</button><button class="btn" id="btn-clear" type="button">清空 JWT</button></div><div class="field"><div class="label">当前 JWT</div><textarea id="jwt" class="input" style="height:84px" placeholder="登录或从本地读取..." readonly></textarea></div></div><div class="card"><h2 class="title">步骤 2：注册与订阅<span id="subState" class="pill">未订阅</span></h2><div class="field" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="btn-sw" type="button">注册 Service Worker</button><button class="btn primary" id="btn-sub" type="button">订阅并上报</button><button class="btn" id="btn-test" type="button">发送测试通知</button></div><div class="field"><div class="label">VAPID Public Key</div><input id="vapid" class="input" placeholder="点击订阅时自动获取" readonly/></div><div class="field"><div class="label">订阅对象</div><pre id="subjson" class="pre">(尚未订阅)</pre></div></div><div class="card" style="grid-column:1/-1"><h2 class="title">日志</h2><div id="log" class="pre" style="min-height:120px">(等待操作)</div></div></div></div><script>const $=(s)=>document.querySelector(s);const logEl=$('#log');function log(m){const d=document.createElement('div');d.textContent='['+new Date().toLocaleTimeString()+'] '+m;logEl.appendChild(d)}const authState=$('#authState');const subState=$('#subState');const jwtEl=$('#jwt');const subOut=$('#subjson');const vapidEl=$('#vapid');const saved=()=>localStorage.getItem('jwt')||'';const save=(t)=>localStorage.setItem('jwt',t);const status=()=>{const t=jwtEl.value.trim();authState.textContent=t?'已登录':'未登录';authState.style.background=t?'#1a3d24':'#3a1f24'};async function login(){const email=$('#email').value.trim();const password=$('#password').value.trim();const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok){log('登录失败: '+(j.error||r.status));return}jwtEl.value=j.token;save(j.token);status();log('JWT 已获取并保存到本地')}function b64urlToUint8Array(s){const pad='='.repeat((4-s.length%4)%4);const base64=(s+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}async function ensureSW(){const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;log('Service Worker 已就绪');return reg}async function subscribe(){const t=jwtEl.value.trim();if(!t){log('请先登录或读取本地 JWT');return}const perm=await Notification.requestPermission();if(perm!=='granted'){log('通知权限未授权');return}const reg=await ensureSW();const kResp=await fetch('/push/public-key');const key=(await kResp.json()).key||'';vapidEl.value=key;if(!key){log('服务端未配置 VAPID_PUBLIC_KEY');return}const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToUint8Array(key)});subOut.textContent=JSON.stringify(sub,null,2);log('已创建订阅，开始上报到服务器');const resp=await fetch('/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(sub)});const j=await resp.json();if(!resp.ok){log('保存订阅失败: '+(j.error||resp.status));return}subState.textContent='已订阅';subState.style.background='#1a3d24';log('服务器已保存订阅')}async function sendTest(){const t=jwtEl.value.trim();if(!t){log('请先登录或读取本地 JWT');return}const r=await fetch('/notifications/test',{method:'POST',headers:{'Authorization':'Bearer '+t}});const j=await r.json();if(!r.ok){log('触发测试失败: '+(j.error||r.status));return}log('测试结果: '+JSON.stringify(j))}$('#btn-login').addEventListener('click',login);$('#btn-load').addEventListener('click',()=>{const t=saved();jwtEl.value=t;status();log(t?'已从本地读取 JWT':'本地没有保存的 JWT')});$('#btn-clear').addEventListener('click',()=>{localStorage.removeItem('jwt');jwtEl.value='';status();log('已清空本地 JWT')});$('#btn-sw').addEventListener('click',ensureSW);$('#btn-sub').addEventListener('click',subscribe);$('#btn-test').addEventListener('click',sendTest);window.addEventListener('load',()=>{const t=saved();if(t){jwtEl.value=t;status();log('已自动加载本地 JWT')}});</script></body></html>
