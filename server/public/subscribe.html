<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Push 订阅</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:24px;line-height:1.5}label{display:block;margin-top:8px}input,button{padding:8px 12px;margin:6px 0}#log{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;padding:12px;border-radius:8px;min-height:120px}code{background:#f2f2f2;padding:2px 4px;border-radius:4px}</style></head><body><h1>Web Push 订阅</h1><div><label>邮箱</label><input id="email" type="email" style="width:320px"/></div><div><label>密码</label><input id="password" type="password" style="width:320px"/></div><div><button id="btn-login">登录获取 JWT</button> <span id="login-status"></span></div><div><button id="btn-sub">注册 Service Worker 并订阅</button> <span id="sub-status"></span></div><div><button id="btn-test">发送测试通知</button></div><h3>日志</h3><div id="log"></div><script>const logEl=document.getElementById('log');function log(m){const d=document.createElement('div');d.textContent='['+new Date().toLocaleTimeString()+'] '+m;logEl.appendChild(d)}let token=null;async function login(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value.trim();const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok){log('登录失败: '+(j.error||r.status));document.getElementById('login-status').textContent='失败';document.getElementById('login-status').style.color='#c00';return}token=j.token;document.getElementById('login-status').textContent='OK';document.getElementById('login-status').style.color='#0a8';log('JWT: 已获取')}function b64urlToUint8Array(base64String){const pad='='.repeat((4-base64String.length%4)%4);const base64=(base64String+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}async function subscribe(){if(!token){log('请先登录');return}const perm=await Notification.requestPermission();if(perm!=='granted'){log('通知权限未授权');return}const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;const kResp=await fetch('/push/public-key');const key=(await kResp.json()).key||'';if(!key){log('服务端未配置 VAPID_PUBLIC_KEY');return}const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64urlToUint8Array(key)});log('订阅对象:');log(JSON.stringify(sub));const resp=await fetch('/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(sub)});const j=await resp.json();if(!resp.ok){log('保存订阅失败: '+(j.error||resp.status));document.getElementById('sub-status').textContent='失败';document.getElementById('sub-status').style.color='#c00';return}document.getElementById('sub-status').textContent='OK';document.getElementById('sub-status').style.color='#0a8';log('已保存订阅')}async function sendTest(){if(!token){log('请先登录');return}const r=await fetch('/notifications/test',{method:'POST',headers:{'Authorization':'Bearer '+token}});const j=await r.json();if(!r.ok){log('触发测试失败: '+(j.error||r.status));return}log('测试结果:');log(JSON.stringify(j))}document.getElementById('btn-login').addEventListener('click',login);document.getElementById('btn-sub').addEventListener('click',subscribe);document.getElementById('btn-test').addEventListener('click',sendTest);</script></body></html>
